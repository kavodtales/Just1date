name: Release API image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image repository
        id: metadata
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: infrastructure/api.Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.image }}:${{ github.sha }}
      - name: Validate worker deployment configuration
        env:
          JUST1DATE_API_IMAGE: ${{ steps.metadata.outputs.image }}@${{ steps.image.outputs.digest }}
        run: |
          cp .env.example .env.worker
          docker compose -f infrastructure/call-worker.compose.yml config --quiet
          echo "Verified worker image: $JUST1DATE_API_IMAGE" >> "$GITHUB_STEP_SUMMARY"
