name: Verify signed Google Play bundle
on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: HTTPS URL of the finished Expo AAB
        required: true
        type: string
      sha256:
        description: Expected SHA-256 of the exact bundle
        required: true
        type: string
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Validate download parameters
        env:
          AAB_URL: ${{ inputs.artifact_url }}
          AAB_SHA256: ${{ inputs.sha256 }}
        run: |
          python - <<'PY'
          import os,re,urllib.parse
          url=urllib.parse.urlparse(os.environ['AAB_URL'])
          assert url.scheme=='https' and url.hostname=='expo.dev' and url.path.startswith('/artifacts/eas/') and url.path.endswith('.aab')
          assert re.fullmatch('[a-fA-F0-9]{64}',os.environ['AAB_SHA256'])
          PY
          curl --fail --location --proto '=https' --proto-redir '=https' --max-filesize 268435456 "$AAB_URL" --output app.aab
          printf '%s  app.aab\n' "$AAB_SHA256" | sha256sum --check
      - name: Verify JAR signature and Google bundle format
        run: |
          LC_ALL=C jarsigner -verify -verbose -certs app.aab > signature.txt
          grep -q 'jar verified' signature.txt
          keytool -printcert -jarfile app.aab > certificate.txt
          python - <<'PY'
          certificate=open('certificate.txt').read().lower().replace(':','')
          assert '5ebcd924f715d62b99ab96b1d0f1931f0491946a8dc725186aa91193c0edf7a6' in certificate
          PY
          curl --fail --location --proto '=https' --proto-redir '=https' https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output bundletool.jar
          printf '%s  bundletool.jar\n' 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' | sha256sum --check
          java -jar bundletool.jar validate --bundle app.aab > bundle-validation.txt
          java -jar bundletool.jar dump manifest --bundle app.aab --module base > manifest.xml
          python scripts/verify-apk.py app.aab > native-verification.json
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('manifest.xml').getroot()
          android='{http://schemas.android.com/apk/res/android}'
          assert root.attrib['package']=='com.just1date.app'
          assert int(root.find('uses-sdk').attrib[android+'targetSdkVersion'])>=36
          assert not any(p.attrib.get(android+'name')=='android.permission.SYSTEM_ALERT_WINDOW' for p in root.findall('uses-permission'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-play-bundle-verification
          path: |
            signature.txt
            certificate.txt
            manifest.xml
            bundle-validation.txt
            native-verification.json
